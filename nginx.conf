# =========================================================================================
# Nginx — sirve el sitio estático que genera `astro build`.
# Se copia a /etc/nginx/conf.d/default.conf (reemplaza la config por defecto de la imagen).
# =========================================================================================

# -----------------------------------------------------------------------------------------
# Política de caché por tipo de recurso.
# Va con `map` (contexto http) y un solo `add_header` en el server, en lugar de un
# `add_header` por location: nginx NO hereda los add_header del bloque padre cuando el hijo
# declara los suyos, así que repartirlos por location borraría las cabeceras de seguridad.
# Las expresiones regulares se evalúan en el orden en que están escritas.
# -----------------------------------------------------------------------------------------
map $uri $coopcasa_cache_control {
    # HTML y todo lo demás: revalidar siempre, para que un deploy nuevo se vea de inmediato.
    default                                 "no-cache, must-revalidate";

    # Assets con hash en el nombre: son inmutables.
    ~^/_astro/                              "public, max-age=31536000, immutable";

    # Imágenes, íconos y fuentes de /public: nombre estable, caché moderada (30 días).
    ~*\.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot)$   "public, max-age=2592000";

    # robots.txt y sitemaps: caché corta (1 hora).
    ~*^/(?:robots\.txt|sitemap[^/]*\.xml)$  "public, max-age=3600";
}

server {
    # Solo IPv4: en contenedores sin IPv6 un `listen [::]:3000` aborta el arranque
    # ("Address family not supported by protocol").
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Detrás del proxy de Coolify: que los redirects de nginx salgan relativos y sin el
    # puerto interno 3000, o el navegador terminaría yendo a https://dominio:3000/...
    absolute_redirect off;
    port_in_redirect off;

    # No revelar la versión de nginx.
    server_tokens off;

    # Cabeceras de seguridad. Sin CSP a propósito: el sitio carga el widget de Turnstile y
    # GSAP, y una CSP mal armada rompería el formulario de afiliación.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $coopcasa_cache_control always;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Endpoint para el HEALTHCHECK del contenedor y el monitoreo de Coolify.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Astro usa build.format = 'directory': /historia -> /historia/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
